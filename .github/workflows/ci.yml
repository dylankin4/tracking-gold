name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases on tags

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          else { $v = "0.0.0-dev.${{ github.run_number }}+$("${{ github.sha }}".Substring(0, 7))" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build exe
        shell: pwsh
        run: ./build.ps1 -Version "${{ steps.version.outputs.version }}" -Package

      - uses: actions/upload-artifact@v4
        with:
          name: TrackingGold-${{ steps.version.outputs.version }}
          path: dist/TrackingGold-*.zip
          retention-days: 14

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TrackingGold-*.zip
          generate_release_notes: true
